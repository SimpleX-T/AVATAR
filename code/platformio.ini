[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I src
    -I src/drivers
    -I src/modules
    -I src/network
    -I src/utils
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.4.2
